      - ./docker/development/local/pn_accounts.yaml:/accounts.yaml:ro
      - pn-f-genesis-data:/home/nonroot/data/genesis
      - pn-f-v1-data:/home/nonroot/data/validator-1
  pn-f:
    <<: *axyl-validator
    depends_on:
      pn-f-genesis: { condition: service_completed_successfully }
    command: >
      /usr/local/bin/rayls node --dev --storage.v2 --datadir /home/nonroot/data --http.addr 0.0.0.0 --http.port 8550 --http --metrics 0.0.0.0:9101 --reth-metrics 0.0.0.0:9200 --txpool.minimal-protocol-fee 0 --txpool.pending-max-count 1000000 --txpool.pending-max-size 1242880000 --txpool.basefee-max-count 1000000 --txpool.basefee-max-size 20971120000 --txpool.queued-max-count 1000000 --txpool.queued-max-size 20971120000 --txpool.max-pending-txns 1000000 --txpool.max-new-txns 1000000 --txpool.max-tx-input-bytes 999999999999 --txpool.max-account-slots 999999999 --gpo.default-suggested-fee 0
    ports:
      - 127.0.0.1:8550:8550
    volumes:
      - pn-f-v1-data:/home/nonroot/data
    networks:
      default:
      pn-f-net:
        ipv4_address: 10.60.0.21
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8550'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  private-hub:
    build:
      context: .
      dockerfile: ./docker/development/local/Dockerfile.besu
    # Podman can't exec the healthcheck as the image's named user "besu"
    # ("unable to find user besu: no matching entries in passwd file"), so the
    # container is reported unhealthy even though Besu is fine. start_dev.sh sets
    # this to the numeric equivalent (1000:1000) so the healthcheck exec skips the
    # passwd lookup. Unset (Docker) -> the image's default user "besu".
    user: ${PRIVATE_HUB_USER:-besu}
    #network_mode: host
    environment:
      - BESU_NODE_PRIVATE_KEY_FILE=/app/besu_node_key
      - BESU_RPC_HTTP_ENABLED=true
      - BESU_RPC_HTTP_PORT=3445
      - BESU_RPC_HTTP_HOST=0.0.0.0
      - BESU_RPC_HTTP_API=ETH,NET,WEB3,CLIQUE,ADMIN,DEBUG,TXPOOL,TRACE
      - BESU_HOST_ALLOWLIST=*
      - BESU_RPC_HTTP_CORS_ORIGINS=*
      - BESU_P2P_ENABLED=false
      - BESU_DISCOVERY_ENABLED=false
      - BESU_MIN_GAS_PRICE=0
      - BESU_DATA_STORAGE_FORMAT=FOREST
      - BESU_REVERT_REASON_ENABLED=true
      - BESU_TX_POOL=sequenced
      - BESU_DATA_PATH=/opt/besu/database
      - BESU_NETWORK_ID=1337
      - BESU_GENESIS_FILE=/app/var/genesis.json
      - BESU_TX_POOL_RETENTION_HOURS=999
      - BESU_TX_POOL_LIMIT_BY_ACCOUNT_PERCENTAGE=1.0
      - BESU_TX_POOL_MAX_SIZE=20000
      - BESU_RPC_HTTP_MAX_REQUEST_CONTENT_LENGTH=20971520
      - BESU_RPC_HTTP_MAX_BATCH_SIZE=-1
    volumes:
      - ./docker/development/local/genesis_cc.json:/app/var/genesis.json:ro
      - ./docker/development/local/besu_node_key:/app/besu_node_key:ro
    ports:
      - 127.0.0.1:3445:3445
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", true],\"id\":1}' 127.0.0.1:3445"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # === AXYL: PUBLIC CHAIN (chain ID 7331 / 0x1CA3, RPC port 8845) ===
  # Non-gasless: pc-genesis deliberately does NOT set GASLESS=true, so the
  # shared axyl_genesis.sh falls back to the default 48 Gwei base fee /
  # min base fee. The deployer (0xf39Fd6…2266) is prefunded via
  # pn_accounts.yaml so it can pay gas on this non-gasless chain.
  # DEV_FUNDED_ACCOUNT must NOT be the contract deployer: axyl genesis seeds
  # system contracts at addresses derived from the dev-funded/consensus-owner
  # account, which would collide with the deployer's nonce-0 CREATE address
  # (EIP-684 → all gas consumed, deploy reverts). Use the same separate
  # account the PN clusters use (0xE4F2…), matching the working PN config.
  pc-setup1:
    <<: *axyl-setup
    depends_on:
      axyl-base: { condition: service_completed_successfully }
    environment:
      - RL_EXTERNAL_PRIMARY_ADDR=/ip4/10.70.0.21/udp/49590/quic-v1
      - RL_EXTERNAL_WORKER_ADDRS=/ip4/10.70.0.21/udp/49595/quic-v1
      - EXECUTION_ADDRESS=0x1111111111111111111111111111111111111111
      - RL_BLS_PASSPHRASE=local
    volumes:
      - ../axyl/etc/docker-network/setup_validator.sh:/setup_validator.sh:ro
      - pc-v1-data:/home/nonroot/data
  pc-genesis:
    image: local-axyl:latest
    pull_policy: never
    user: "root"
    command: ["bash", "/genesis.sh"]
    environment:
      - RL_BLS_PASSPHRASE=local
      - CHAIN_ID=0x1CA3
      - GAS_LIMIT=281474976710655
      - DEV_FUNDED_ACCOUNT=0xE4F2eB9B68cd50c604B5C16258167F77B6b23F31
      # Lower this (e.g. 60) to trigger axyl epoch transitions frequently.
      # Default 86400 (24h) means no epoch transitions during normal
      # dev/test runs. Baked into chain genesis; changing it requires
      # `start_dev.sh --clean`.
      - RAYLS_AXYL_EPOCH_DURATION_SECS=${RAYLS_AXYL_EPOCH_DURATION_SECS:-86400}
    depends_on:
      pc-setup1: { condition: service_completed_successfully }
    volumes:
      - ./docker/development/local/axyl_genesis.sh:/genesis.sh:ro
      - ./docker/development/local/pn_accounts.yaml:/accounts.yaml:ro
      - pc-genesis-data:/home/nonroot/data/genesis
      - pc-v1-data:/home/nonroot/data/validator-1
  public-chain:
    <<: *axyl-validator
    depends_on:
      pc-genesis: { condition: service_completed_successfully }
    command: >
      /usr/local/bin/rayls node --dev --storage.v2 --datadir /home/nonroot/data --http.addr 0.0.0.0 --http.port 8845 --http --metrics 0.0.0.0:9101 --reth-metrics 0.0.0.0:9200 --txpool.minimal-protocol-fee 48000000000 --txpool.pending-max-count 1000000 --txpool.pending-max-size 1242880000 --txpool.basefee-max-count 1000000 --txpool.basefee-max-size 20971120000 --txpool.queued-max-count 1000000 --txpool.queued-max-size 20971120000 --txpool.max-pending-txns 1000000 --txpool.max-new-txns 1000000 --txpool.max-tx-input-bytes 999999999999 --txpool.max-account-slots 999999999 --gpo.default-suggested-fee 48000000000
    ports:
      - 127.0.0.1:8845:8845
    volumes:
      - pc-v1-data:/home/nonroot/data
    networks:
      default:
      pc-net:
        ipv4_address: 10.70.0.21
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8845'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  proofs-api:
    build:
      context: ../rayls-privacy-gnark-api
      dockerfile: Dockerfile
    # Same Podman named-user healthcheck issue as private-hub: the image's "appuser"
    # (uid 999) can't be resolved by podman's healthcheck exec. start_dev.sh sets this
    # to 999:999 on Podman so the exec skips the passwd lookup. Unset (Docker) -> "appuser".
    user: ${PROOFS_API_USER:-appuser}
    ports:
      - 127.0.0.1:3003:3003
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl --fail http://127.0.0.1:3003/healthcheck'
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 30s
  contracts:
    build:
      context: ../rayls-privacy-contracts
      dockerfile: Dockerfile.dev
      args:
        - CUSTOM_UID=${CUSTOM_UID:-1000}
        - CUSTOM_GID=${CUSTOM_GID:-1000}
    #entrypoint: bash /app/deploy_contracts.sh
    #network_mode: host
    #stdin_open: true # docker run -i
    #tty: true # docker run -t
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      - RELAYER_PATH=/parfin/rayls-privacy-relayer-api
      - PARTICIPANT_LIST=${PARTICIPANT_LIST:-A,B}
      - CUSTOM_UID=${CUSTOM_UID:-1000}
      - CUSTOM_GID=${CUSTOM_GID:-1000}
      - DEV_MODE=${DEV_MODE:-local}
      - GOVERNANCE_ENABLED=${GOVERNANCE_ENABLED:-true}
      - PUBLIC_CHAIN_ENABLED=${PUBLIC_CHAIN_ENABLED:-true}
      # HUB_ENABLED=false (start_dev.sh --no-hub) tells the deploy to skip the
      # Private Hub (PNH) contracts and NOT write PNH_DEPLOYMENT_PROXY_REGISTRY /
      # PNH_RPC_URL into the participant .env files, so CTS's PrivateHubEnabled()
      # reads false and CTS + public relayers boot without a hub.
      - HUB_ENABLED=${HUB_ENABLED:-true}
      - OPS_API_ENABLED=${OPS_API_ENABLED:-true}
    #user: "${CUSTOM_UID:-1000}:${CUSTOM_GID:-1000}"
    # CUSTOM_UID/GID come from start_dev.sh: the host uid/gid on Docker, or 0 on rootless
    # Podman so this container runs as root — it must write the image-baked root-owned
    # cache_forge dir, and rootless maps container root -> host user, so the bindings/.env
    # it chowns to CUSTOM_UID land owned by us on the host (not a 100999 subuid).
    volumes:
      - ../rayls-privacy-contracts/.env:/parfin/rayls-privacy-contracts/.env
      - ../rayls-privacy-pnh-governance-api/config:/parfin/rayls-privacy-pnh-governance-api/config
      - ../rayls-privacy-pnh-governance-api/.env:/parfin/rayls-privacy-pnh-governance-api/.env
      - ../rayls-privacy-pnh-governance-api/contracts:/parfin/rayls-privacy-pnh-governance-api/contracts
      - ../rayls-privacy-ops-api/contracts:/parfin/rayls-privacy-ops-api/contracts
      - .:/parfin/rayls-privacy-relayer-api
    depends_on:
      proofs-api:
        condition: service_healthy
      pn-a:
        condition: service_healthy
      pn-b:
        condition: service_healthy
      # pn-c:
      #   condition: service_healthy
      # pn-d:
      #   condition: service_healthy
      # pn-e:
      #   condition: service_healthy
      # pn-f:
      #   condition: service_healthy
      private-hub:
        condition: service_healthy
      # public-chain:
      #   condition: service_healthy
    healthcheck:
      # This service takes ~10min to compile and deploy all contracts.
      # Most of the time is spent deploying contracts, therefore reducing block times will speed up this process.
      test:
        - 'CMD-SHELL'
        - 'curl --fail http://127.0.0.1:7000'
      interval: 10s
      timeout: 30s
      retries: 100
      start_period: 60s
  # governance-postgres-adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 127.0.0.1:9105:8080
  governance-api:
    build:
      context: ../rayls-privacy-pnh-governance-api
      dockerfile: Dockerfile.api-dev
    ports:
      - 127.0.0.1:9100:8080
      - 127.0.0.1:4030:4030
    env_file:
      - .A.env
    environment:
      - CONFIG_FILE=/app/.env
      - GO_DEBUG_PORT=4030
      - OTEL_SERVICE_NAME=governance-api
    volumes:
      - ../rayls-privacy-pnh-governance-api/.env:/app/.env:ro
    depends_on:
      contracts:
        condition: service_healthy
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/go.mod
          target: /app/go.mod
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/go.sum
          target: /app/go.sum
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/air.api.toml
          target: /app/air.api.toml
        - action: sync
          path: ../rayls-privacy-pnh-governance-api/
          target: /app
  governance-listener:
    build:
      context: ../rayls-privacy-pnh-governance-api
      dockerfile: Dockerfile.listener-dev
    ports:
      - 127.0.0.1:9101:8081
      - 127.0.0.1:4031:4031
    env_file:
