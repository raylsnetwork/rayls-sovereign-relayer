      - RL_EXTERNAL_WORKER_ADDRS=/ip4/10.50.0.21/udp/49595/quic-v1
      - EXECUTION_ADDRESS=0x1111111111111111111111111111111111111111
      - RL_BLS_PASSPHRASE=local
    volumes:
      - ../axyl/etc/docker-network/setup_validator.sh:/setup_validator.sh:ro
      - pn-e-v1-data:/home/nonroot/data
  pn-e-genesis:
    image: local-axyl:latest
    pull_policy: never
    user: "root"
    command: ["bash", "/genesis.sh"]
    environment:
      - RL_BLS_PASSPHRASE=local
      - GASLESS=true
      - CHAIN_ID=0x303D
      - GAS_LIMIT=281474976710655
      - DEV_FUNDED_ACCOUNT=0xE4F2eB9B68cd50c604B5C16258167F77B6b23F31
      # Lower this (e.g. 60) to trigger axyl epoch transitions frequently.
      # Default 86400 (24h) means no epoch transitions during normal
      # dev/test runs. Baked into chain genesis; changing it requires
      # `start_dev.sh --clean`.
      - RAYLS_AXYL_EPOCH_DURATION_SECS=${RAYLS_AXYL_EPOCH_DURATION_SECS:-86400}
    depends_on:
      pn-e-setup1: { condition: service_completed_successfully }
    volumes:
      - ./docker/development/local/axyl_genesis.sh:/genesis.sh:ro
      - ./docker/development/local/pn_accounts.yaml:/accounts.yaml:ro
      - pn-e-genesis-data:/home/nonroot/data/genesis
      - pn-e-v1-data:/home/nonroot/data/validator-1
  pn-e:
    <<: *axyl-validator
    depends_on:
      pn-e-genesis: { condition: service_completed_successfully }
    command: >
      /usr/local/bin/rayls node --dev --storage.v2 --datadir /home/nonroot/data --http.addr 0.0.0.0 --http.port 8549 --http --metrics 0.0.0.0:9101 --reth-metrics 0.0.0.0:9200 --txpool.minimal-protocol-fee 0 --txpool.pending-max-count 1000000 --txpool.pending-max-size 1242880000 --txpool.basefee-max-count 1000000 --txpool.basefee-max-size 20971120000 --txpool.queued-max-count 1000000 --txpool.queued-max-size 20971120000 --txpool.max-pending-txns 1000000 --txpool.max-new-txns 1000000 --txpool.max-tx-input-bytes 999999999999 --txpool.max-account-slots 999999999 --gpo.default-suggested-fee 0
    ports:
      - 127.0.0.1:8549:8549
    volumes:
      - pn-e-v1-data:/home/nonroot/data
    networks:
      default:
      pn-e-net:
        ipv4_address: 10.50.0.21
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8549'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  # === AXYL: PL-F (chain ID 12350 / 0x303E, RPC port 8550) ===
  pn-f-setup1:
    <<: *axyl-setup
    depends_on:
      axyl-base: { condition: service_completed_successfully }
    environment:
      - RL_EXTERNAL_PRIMARY_ADDR=/ip4/10.60.0.21/udp/49590/quic-v1
      - RL_EXTERNAL_WORKER_ADDRS=/ip4/10.60.0.21/udp/49595/quic-v1
      - EXECUTION_ADDRESS=0x1111111111111111111111111111111111111111
      - RL_BLS_PASSPHRASE=local
    volumes:
      - ../axyl/etc/docker-network/setup_validator.sh:/setup_validator.sh:ro
      - pn-f-v1-data:/home/nonroot/data
  pn-f-genesis:
    image: local-axyl:latest
    pull_policy: never
    user: "root"
    command: ["bash", "/genesis.sh"]
    environment:
      - RL_BLS_PASSPHRASE=local
      - GASLESS=true
      - CHAIN_ID=0x303E
      - GAS_LIMIT=281474976710655
      - DEV_FUNDED_ACCOUNT=0xE4F2eB9B68cd50c604B5C16258167F77B6b23F31
      # Lower this (e.g. 60) to trigger axyl epoch transitions frequently.
      # Default 86400 (24h) means no epoch transitions during normal
      # dev/test runs. Baked into chain genesis; changing it requires
      # `start_dev.sh --clean`.
      - RAYLS_AXYL_EPOCH_DURATION_SECS=${RAYLS_AXYL_EPOCH_DURATION_SECS:-86400}
    depends_on:
      pn-f-setup1: { condition: service_completed_successfully }
    volumes:
