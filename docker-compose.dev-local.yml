        condition: service_healthy
      nats:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/go.mod
          target: /app/go.mod
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/go.sum
          target: /app/go.sum
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/air.listener.toml
          target: /app/air.listener.toml
        - action: sync
          path: ../rayls-privacy-pnh-governance-api/
          target: /app
  governance-flagger:
    build:
      context: ../rayls-privacy-pnh-governance-api
      dockerfile: Dockerfile.flagger-dev
    ports:
      - 127.0.0.1:9102:8082
      - 127.0.0.1:4032:4032
    env_file:
      - .A.env
    environment:
      - CONFIG_FILE=/app/.env
      - GO_DEBUG_PORT=4032
      - OTEL_SERVICE_NAME=governance-flagger
    volumes:
      - ../rayls-privacy-pnh-governance-api/.env:/app/.env:ro
    depends_on:
      contracts:
        condition: service_healthy
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/go.mod
          target: /app/go.mod
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/go.sum
          target: /app/go.sum
        - action: sync+restart
          path: ../rayls-privacy-pnh-governance-api/air.flagger.toml
          target: /app/air.flagger.toml
        - action: sync
          path: ../rayls-privacy-pnh-governance-api/
          target: /app
  auditor-explorer:
    build:
      context: ../rayls-privacy-pnh-auditor-ui
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:4080:80
    environment:
      - RAYLS_API=/api
    depends_on:
      governance-api:
        condition: service_started
  cts-a:
    <<: *cts-base
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:8090:8090
      - 127.0.0.1:4000:4000
      # Fault-injection control surface — matches KOS_FAULT_INJECTION_PORT in
      # .A.env. Active only when the binary is built with -tags faultinjection
      # (start_dev.sh default); compiled-out no-op otherwise. Required by
      # FaultInjector.forService('kos', 'A', '127.0.0.1') in the e2e suite.
      - 127.0.0.1:6800:6800
    env_file:
      - path: .A.env
        required: false
    environment:
      - ENV_FILE=.A.env
      - GO_DEBUG_PORT=4000
      - OTEL_SERVICE_NAME=cts-a
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
    develop:
      watch:
        - action: sync+restart
          path: ./go.mod
          target: /app/go.mod
        - action: sync+restart
          path: ./go.sum
          target: /app/go.sum
        - action: sync+restart
          path: ./.A.env
          target: /app/.A.env
        - action: sync+restart
          path: ./cts/air.toml
          target: /app/cts/air.toml
        - action: sync
          path: ./
          target: /app
  cts-b:
    <<: *cts-base
    ports:
      - 127.0.0.1:8081:8081
      - 127.0.0.1:8091:8091
      - 127.0.0.1:4001:4001
      # Fault-injection control surface — exposed only when the binary is
      # built with `-tags faultinjection` (default in start_dev.sh). The
      # FaultInjector.forService('kos', 'B', '127.0.0.1') call in the e2e
      # suite reaches the CTS FI server through this mapping.
      - 127.0.0.1:6801:6801
    env_file:
      - path: .B.env
        required: false
    environment:
      - ENV_FILE=.B.env
      - GO_DEBUG_PORT=4001
      - OTEL_SERVICE_NAME=cts-b
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
    develop:
