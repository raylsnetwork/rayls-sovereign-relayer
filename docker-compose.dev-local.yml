  # playground: Next.js 16 dApp from ../rayls-privacy-playground. The repo's
  # Dockerfile is production-only (3-stage standalone build) — for dev we run
  # `npm run dev` directly on node:20-alpine with the source bind-mounted so
  # hot-reload works without rebuilding. `node_modules` lives in a named volume
  # so the host bind-mount doesn't shadow it and recreates skip reinstall.
  #
  # Server-side env (BLOCKSCOUT_<chainId>) is read at runtime by the API routes
  # under /api/blockscout/[chainId]. Client-side NEXT_PUBLIC_* are normally
  # baked at build time but in `npm run dev` they're read from process.env at
  # request time, which lets us point the dApp at our local ops-api and chains
  # without rebuilding the image.
  # playground-hub: dApp bound to the Private Hub (chain 1337). The Hub has no
  # dedicated ops-api yet, so OPS_SERVICE_URL points at ops-api-a as a
  # placeholder — identity/cookie flow works, but Hub-only views may show
  # restricted until a Hub-side ops-api exists.
  playground-hub:
    <<: *playground-base
    volumes:
      - ../rayls-privacy-playground:/app
      - playground-hub-modules:/app/node_modules
      - playground-hub-next:/app/.next
    ports:
      - 127.0.0.1:3700:3000
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_CHAIN_ID: "1337"
      NEXT_PUBLIC_CHAIN_NAME: "Private Hub"
      NEXT_PUBLIC_CHAIN_RPC_URL: http://localhost:3445
      NEXT_PUBLIC_CHAIN_REGISTRY_ADDRESS: ${PNH_DEPLOYMENT_PROXY_REGISTRY:-0x0000000000000000000000000000000000000000}
      NEXT_PUBLIC_CHAIN_IS_HUB: "true"
      NEXT_PUBLIC_OPS_SERVICE_URL: http://localhost:9780
      # Server-side fetches from Next.js route handlers use this URL (the
      # client-side NEXT_PUBLIC_* points at the host, which the container
      # can't reach). Service-name DNS within the Compose network.
      OPS_SERVICE_INTERNAL_URL: http://ops-api-a:8080
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
      NEXT_PUBLIC_PH_AUDITOR_ADDRESS: ${PH_AUDITOR_ADDRESS:-}
    depends_on:
      ops-api-a:
        condition: service_healthy

  # playground-a: dApp bound to Privacy Node A (chain 12345). Talks to
  # ops-api-a for auth and to BLOCKSCOUT_12345 (server-side proxy) for the
  # block explorer.
  playground-a:
    <<: *playground-base
    volumes:
      - ../rayls-privacy-playground:/app
      - playground-a-modules:/app/node_modules
      - playground-a-next:/app/.next
    ports:
      - 127.0.0.1:3701:3000
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_CHAIN_ID: "12345"
      NEXT_PUBLIC_CHAIN_NAME: "Privacy Node A"
      NEXT_PUBLIC_CHAIN_RPC_URL: http://localhost:8545
      NEXT_PUBLIC_CHAIN_REGISTRY_ADDRESS: ${OPS_API_A_DEPLOYMENT_PROXY_REGISTRY:-0x0000000000000000000000000000000000000000}
      NEXT_PUBLIC_CHAIN_IS_HUB: "false"
      NEXT_PUBLIC_CHAIN_AUDITOR_ADDRESS: ${PN_A_AUDITOR_ADDRESS:-}
      NEXT_PUBLIC_OPS_SERVICE_URL: http://localhost:9780
      # Server-side fetches use this URL (see playground-hub comment).
      OPS_SERVICE_INTERNAL_URL: http://ops-api-a:8080
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
      # Server-side: /api/blockscout/[chainId] reads BLOCKSCOUT_<chainId>.
      # host.docker.internal reaches the Blockscout proxy bound on the host.
      BLOCKSCOUT_12345: http://host.docker.internal:8480
    depends_on:
      ops-api-a:
        condition: service_healthy

