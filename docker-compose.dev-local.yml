  # ops-api-a: HTTP API for participant A. The code is single-instance by design;
  # we run two containers with per-participant env overrides (DATABASE_CONNECTIONSTRING,
  # PN_RPC_URL) to match the relayer-a / relayer-b pattern.
  ops-api-a:
    <<: *ops-api-base
    volumes:
      # YAML merge replaces (not appends) `volumes:` from the anchor, so the
      # source bind-mount and the NATS mTLS certs must be repeated here.
      - ../rayls-privacy-ops-api:/app
      - ./private-relayer/certs:/nats-certs:ro
      - ops-api-a-go-modules:/go/pkg/mod
      # Per-container tmp dir masks the shared bind-mount so air doesn't race
      # against the other ops-* containers on /app/tmp/app/<binary>.
      - ops-api-a-tmp:/app/tmp
    # YAML merge replaces `depends_on` too, so we repeat the anchor's deps
    # alongside the per-instance custody-a.
    depends_on:
      contracts: { condition: service_healthy }
      postgres:  { condition: service_healthy }
      nats:      { condition: service_healthy }
      custody-a: { condition: service_healthy }
    ports:
      - 127.0.0.1:9780:8080
      - 127.0.0.1:2345:2345
    environment:
      INSTANCE_NAME: a
      BASE_URL: http://localhost:9780
      CORSURLS: "http://localhost:3000;http://localhost:3700;http://localhost:3701;http://localhost:3702;http://localhost:9780;http://localhost:9880"
      RAYLS_MODE: privacy_node
      DATABASE_CONNECTIONSTRING: "host=postgres port=5432 user=admin password=admin dbname=ops_api_a sslmode=disable"
      # Unified Postgres also hosts the Blockscout DB for this participant
      # (see docker/development/postgres-init.sh + BLOCKSCOUT_ENABLED path).
      # ops-api installs LISTEN/NOTIFY triggers on it and backfills tokens.
      BLOCKSCOUT_DB_CONN: "postgres://admin:admin@postgres:5432/blockscout_pn-a?sslmode=disable"
      CUSTODY_RAYLS_HSM_URL: "http://custody-a:5000"
      CUSTODY_RAYLS_HSM_API_KEY: dev  # dev-only — do not use in prod
      CUSTODY_RAYLS_HSM_PASSWORD: dev-password  # dev-only — do not use in prod
      NATS_URL: "nats://nats:4222"
      NATS_TLS_CA_FILE: /nats-certs/ca.crt
      NATS_TLS_CERT_FILE: /nats-certs/private-relayer.crt
      NATS_TLS_KEY_FILE: /nats-certs/private-relayer.key
      PN_RPC_URL: "${PRIVACY_NODE_A_RPC_URL:-http://pn-a:8545}"
      BLOCKCHAIN_RPC_URL: "${PRIVACY_NODE_A_RPC_URL:-http://pn-a:8545}"
      DEPLOYMENT_PROXY_REGISTRY_ADDR: ${OPS_API_A_DEPLOYMENT_PROXY_REGISTRY:-}
      # Destination chain ID packed into teleportToPublicChain calldata. Defaults to
      # the pc-genesis chain id (0x1CA3 = 7331).
      PUBLIC_CHAIN_CHAIN_ID: "${PUBLIC_CHAIN_ID:-7331}"
      JWT_SECRET: dev-secret-do-not-use-in-prod
      # OAuth credentials sourced from .env.oauth (gitignored). When empty,
      # /auth/google/login and /auth/microsoft/login respond 404 (boot still OK).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      POST_LOGIN_REDIRECT_URL: http://localhost:3700
      OTEL_SERVICE_NAME: ops-api-a
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}

  ops-worker-a:
    <<: *ops-worker-base
    volumes:
      - ../rayls-privacy-ops-api:/app
      - ./private-relayer/certs:/nats-certs:ro
      - ops-worker-a-go-modules:/go/pkg/mod
      - ops-worker-a-tmp:/app/tmp
    ports:
      - 127.0.0.1:2346:2345
    environment:
      INSTANCE_NAME: a
      BASE_URL: http://localhost:8080
      RAYLS_MODE: privacy_node
      CORSURLS: "http://localhost:3000"
      JWT_SECRET: dev-secret-do-not-use-in-prod
