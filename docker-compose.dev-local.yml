# This docker-compose file is meant to be used for local development.
# DO NOT USE THIS FOR PRODUCTION!

# --- YAML anchor base configs for participant services (a-f) ---

# Axyl-based privacy node anchors
x-axyl-setup: &axyl-setup
  image: local-axyl:latest
  pull_policy: never
  user: "root"
  command: ["bash", "/setup_validator.sh"]

x-axyl-validator: &axyl-validator
  image: local-axyl:latest
  pull_policy: never
  user: "1101:1101"
  environment:
    - RUST_LOG=info,execution=debug,primary::cert_fetcher=debug,primary::cert_manager=debug,rayls-consensus-state-sync=debug
    - RL_BLS_PASSPHRASE=local
    - RAYLS_NETWORK=local
    - PRIMARY_LISTENER_MULTIADDR=/ip4/0.0.0.0/udp/49590/quic-v1
    - WORKER_LISTENER_MULTIADDR=/ip4/0.0.0.0/udp/49595/quic-v1

x-cts-base: &cts-base
  image: rayls-cts:dev
  depends_on:
    contracts:
      condition: service_healthy
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
  #network_mode: host
  # /ready returns 503 until MarkReady fires (post AccessManager role
  # grant + key-agreement creation), which can take ~3m40s on a clean boot.
  healthcheck:
    test:
      - 'CMD-SHELL'
      - 'curl -sf http://127.0.0.1:$${CTS_HTTP_PORT}/ready'
    interval: 5s
    timeout: 30s
    retries: 100
    start_period: 30s

x-relayer-base: &relayer-base
  image: rayls-relayer:dev
  #network_mode: host
  # Each relayer instance binds the healthcheck server to its own port via
  # PRIVATE_RELAYER_HEALTHCHECK_PORT (set in .A.env..F.env: 9000, 9001, ...).
  # The $$ escapes compose-level interpolation so the shell inside the container
  # expands it at exec time.
  healthcheck:
    test:
      - 'CMD-SHELL'
      - 'curl --fail http://127.0.0.1:$${PRIVATE_RELAYER_HEALTHCHECK_PORT:-9000}/healthcheck'
    interval: 10s
    timeout: 30s
    retries: 20

x-pubrelayer-base: &pubrelayer-base
  image: rayls-pubrelayer:dev
  #network_mode: host
  healthcheck:
    test:
      - 'CMD-SHELL'
      - 'curl --fail http://127.0.0.1:9000/healthcheck'
    interval: 10s
    timeout: 30s
    retries: 20

# Ops API: shared base for both per-participant API containers. Build is via the
# upstream Dockerfile.dev (golang:1.24-alpine + air for hot-reload). Code is
# bind-mounted from the sibling repo. The relayer-api's private-relayer client
# certs are mounted read-only into /nats-certs so the ops-api can do mTLS to the
# shared NATS server (which is configured with `verify: true`).
#
# Note: the Go module cache (`/go/pkg/mod`) is intentionally NOT in this anchor.
# A single shared named volume hits Docker's concurrent "populate from image"
# race on first start (the four containers all try to copy /go/pkg/mod from the
# image into one volume at once, producing "mkdir ... file exists" errors).
# Each service mounts its own named volume to avoid the race entirely.
x-ops-api-base: &ops-api-base
  build:
    context: ../rayls-privacy-ops-api
    dockerfile: Dockerfile.dev
  security_opt:
    - seccomp:unconfined
  cap_add:
    - SYS_PTRACE
  volumes:
    - ../rayls-privacy-ops-api:/app
    - ./private-relayer/certs:/nats-certs:ro
  depends_on:
    # custody-<i> dependency is added per-instance (each ops-api binds to its
    # own custody container; see ops-api-a/-b for the explicit depends_on).
    contracts:
      condition: service_healthy
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
  healthcheck:
    test:
      - 'CMD-SHELL'
      - 'wget -qO- http://127.0.0.1:8080/health || exit 1'
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 30s

# Ops Worker: same code base, different entrypoint (the `worker` subcommand).
# No HTTP port (just delve for debugging); no custody dep (only the API talks to HSM).
# Same NATS mTLS cert mount as the API base. See the api anchor's comment about
# per-service Go module volumes (avoids Docker's concurrent populate race).
x-ops-worker-base: &ops-worker-base
  build:
    context: ../rayls-privacy-ops-api
    dockerfile: Dockerfile.worker.dev
  security_opt:
    - seccomp:unconfined
  cap_add:
    - SYS_PTRACE
  volumes:
    - ../rayls-privacy-ops-api:/app
    - ./private-relayer/certs:/nats-certs:ro
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy

# Playground (Next.js 16 dApp): each container binds to ONE chain via the
# NEXT_PUBLIC_CHAIN_* env vars parsed in src/lib/chains.ts. We run one per
# chain (Hub + 1 per Privacy Node) on a shared source bind-mount, each with
# isolated node_modules and .next volumes so parallel `npm run dev` instances
# don't collide on the build cache.
x-playground-base: &playground-base
  image: node:20-alpine
  working_dir: /app
  command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
  user: "0:0"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 30
    start_period: 120s

services:
  # PostgreSQL for relayer and CTS services
  postgres:
    # Custom image bakes in postgres-init.sh via COPY (not bind mount), avoiding
    # macOS Docker Desktop VirtioFS quirks that strip/break exec bits on mounted
    # init scripts and cause "bad interpreter: Permission denied" at runtime.
    build:
      context: ./docker/development
      dockerfile: postgres.Dockerfile
    image: rayls-postgres-dev:local
    command: postgres -c max_connections=500
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
      DB_NAMES: ${DB_NAMES:-}
      # pg_ctl uses this for its `-w` shutdown timeout. The official postgres
      # docker-entrypoint runs `pg_ctl -m fast -w stop` after the init scripts
      # finish; with the default 60s, the shutdown checkpoint can exceed the
      # budget under concurrent I/O (axyl validators + image builds), the
      # entrypoint exits with non-zero, the container dies, and every service
      # with `depends_on: postgres {condition: service_healthy}` is left in
      # "Created" state. 300s comfortably absorbs the observed slowness.
      # See: test/e2e/security/resilience/Postgres_SlowShutdown_DependentServicesStartup.ts
      PGCTLTIMEOUT: 300
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MongoDB for privacy nodes (pl-a to pl-f) - keeping for privacy node internal use
  mongodb:
    image: mongo:6-jammy
    command: --replSet rs0 --bind_ip 0.0.0.0
    # On rapid `--clean` relaunch, the previous container's host-port
    # binding for 127.0.0.1:27017 can still be held by the kernel
    # (docker-proxy / TIME_WAIT) when the new container tries to bind.
    # mongodb itself does not retry the bind; it just exits 48
    # ("Address already in use"), which cascades every depends_on:
    # service_healthy dependent into 'Created' state. Bounded
    # auto-restart heals the transient bind race in seconds without
    # masking a genuine misconfiguration: on-failure:5 caps at 5
    # attempts, so a real port conflict (another process owning 27017)
    # still surfaces as a final-failure exit instead of spinning forever.
    restart: on-failure:5
    #network_mode: host
    # user: "${UID}:${GID}"
    extra_hosts:
      - mongodb:127.0.0.1
    volumes:
      - ./docker/development/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    # MongoDB official recommendations for production (https://www.mongodb.com/docs/manual/reference/ulimit/)
    # Prevents "too many open files" errors with high connection loads (24+ services connecting)
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
      nproc:
        soft: 64000
        hard: 64000
    healthcheck:
      test: "mongosh admin --host 127.0.0.1 --username admin --password admin --eval 'db.runCommand({ ping: 1 }).ok && db.isMaster().ismaster'"
      # test: [ "CMD-SHELL", "mongosh admin --host 127.0.0.1 --username admin --password admin --eval 'db.runCommand({ ping: 1 }).ok && db.isMaster().ismaster'" ]
      start_period: 10s
      interval: 10s
      timeout: 20s
      retries: 5
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 127.0.0.1:9988:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
  # --- Image builders (build once, shared by all participants) ---
  axyl-base:
    image: local-axyl:latest
    pull_policy: never
    build:
      # Defaults to the sibling ../axyl checkout. Override with AXYL_BUILD_CONTEXT to build
      # from a different checkout/worktree (e.g. a branch that carries `--dev` before it lands
      # on the axyl checkout you normally use).
      context: ${AXYL_BUILD_CONTEXT:-../axyl}
      dockerfile: etc/docker-network/Dockerfile
      args:
        # reth's build.rs unconditionally slices VERGEN_GIT_SHA (&sha[0..7], &sha[..8]),
        # so an empty value panics ("byte index 7 is out of bounds of ``"). start_dev.sh
        # exports AXYL_GIT_SHA from ../axyl HEAD; the all-zeros default keeps a manual
        # `docker compose build axyl-base` (without start_dev.sh) from panicking too.
        VERGEN_GIT_SHA: ${AXYL_GIT_SHA:-0000000000000000000000000000000000000000}
        # Cargo features to compile into the axyl binary, passed to the axyl Dockerfile's
        # BUILD_FEATURES ARG. We build with `dev-single-node-setup` so `rayls node --dev`
        # (single-validator local chains) is available — the local PNs + public chain run
        # in --dev mode. A dev build is single-node ONLY (it refuses multi-validator
        # committees), which matches this compose exactly; conversely a production build
        # (no feature) cannot run this compose at all — it has no `--dev` flag and rejects
        # 1-validator committees — so don't override this with an empty value.
        BUILD_FEATURES: ${AXYL_BUILD_FEATURES:-dev-single-node-setup}
    command: ["echo", "Axyl image built"]

  cts:
    image: rayls-cts:dev
    build:
      context: .
      dockerfile: cts/Dockerfile.dev
    profiles: ["build"]

  relayer:
    image: rayls-relayer:dev
    build:
      context: .
      dockerfile: private-relayer/Dockerfile.dev
    profiles: ["build"]

  pubrelayer:
    image: rayls-pubrelayer:dev
    build:
      context: .
      dockerfile: public-relayer/Dockerfile.dev
    profiles: ["build"]

  # === AXYL: PN-A (chain ID 12345 / 0x3039, RPC port 8545) ===
  pn-a-setup1:
    <<: *axyl-setup
    depends_on:
      axyl-base: { condition: service_completed_successfully }
    environment:
      - RL_EXTERNAL_PRIMARY_ADDR=/ip4/10.10.0.21/udp/49590/quic-v1
      - RL_EXTERNAL_WORKER_ADDRS=/ip4/10.10.0.21/udp/49595/quic-v1
      - EXECUTION_ADDRESS=0x1111111111111111111111111111111111111111
      - RL_BLS_PASSPHRASE=local
    volumes:
      - ../axyl/etc/docker-network/setup_validator.sh:/setup_validator.sh:ro
      - pn-a-v1-data:/home/nonroot/data
  pn-a-genesis:
    image: local-axyl:latest
    pull_policy: never
    user: "root"
    command: ["bash", "/genesis.sh"]
    environment:
      - RL_BLS_PASSPHRASE=local
      - GASLESS=true
      - CHAIN_ID=0x3039
      - GAS_LIMIT=281474976710655
      - DEV_FUNDED_ACCOUNT=0xE4F2eB9B68cd50c604B5C16258167F77B6b23F31
      # Lower this (e.g. 60) to trigger axyl epoch transitions frequently.
      # Default 86400 (24h) means no epoch transitions during normal
      # dev/test runs. Baked into chain genesis; changing it requires
      # `start_dev.sh --clean`.
      - RAYLS_AXYL_EPOCH_DURATION_SECS=${RAYLS_AXYL_EPOCH_DURATION_SECS:-86400}
    depends_on:
      pn-a-setup1: { condition: service_completed_successfully }
    volumes:
      - ./docker/development/local/axyl_genesis.sh:/genesis.sh:ro
      - ./docker/development/local/pn_accounts.yaml:/accounts.yaml:ro
      - pn-a-genesis-data:/home/nonroot/data/genesis
      - pn-a-v1-data:/home/nonroot/data/validator-1
  pn-a:
    <<: *axyl-validator
    depends_on:
      pn-a-genesis: { condition: service_completed_successfully }
    command: >
      /usr/local/bin/rayls node --dev --storage.v2 --datadir /home/nonroot/data --http.addr 0.0.0.0 --http.port 8545 --http --metrics 0.0.0.0:9101 --reth-metrics 0.0.0.0:9200 --txpool.minimal-protocol-fee 0 --txpool.pending-max-count 1000000 --txpool.pending-max-size 1242880000 --txpool.basefee-max-count 1000000 --txpool.basefee-max-size 20971120000 --txpool.queued-max-count 1000000 --txpool.queued-max-size 20971120000 --txpool.max-pending-txns 1000000 --txpool.max-new-txns 1000000 --txpool.max-tx-input-bytes 999999999999 --txpool.max-account-slots 999999999 --gpo.default-suggested-fee 0
    ports:
      - 127.0.0.1:8545:8545
      - 127.0.0.1:9545:9101 # consensus metrics
      - 127.0.0.1:9645:9200 # execution metrics
    volumes:
      - pn-a-v1-data:/home/nonroot/data
    networks:
      default:
      pn-a-net:
        ipv4_address: 10.10.0.21
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8545'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  # === AXYL: PL-B (chain ID 12346 / 0x303A, RPC port 8546) ===
  pn-b-setup1:
    <<: *axyl-setup
    depends_on:
      axyl-base: { condition: service_completed_successfully }
    environment:
      - RL_EXTERNAL_PRIMARY_ADDR=/ip4/10.20.0.21/udp/49590/quic-v1
      - RL_EXTERNAL_WORKER_ADDRS=/ip4/10.20.0.21/udp/49595/quic-v1
      - EXECUTION_ADDRESS=0x1111111111111111111111111111111111111111
