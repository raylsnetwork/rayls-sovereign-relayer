  # OpenTelemetry (OTeL)
  otel:
    image: docker.io/grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3300:3000" # graphana ui http://otel:3300 http://localhost:3300 http://127.0.0.1:3300
      - "127.0.0.1:3100:3100" # loki (logging)
      - "127.0.0.1:3090:9090" # prometheus ui (metrics) http://otel:3090 http://localhost:3090 http://127.0.0.1:3090
      - "127.0.0.1:3040:4040" # pyroscope ui (profiling) http://otel:3040 http://localhost:3040 http://127.0.0.1:3040
      - "127.0.0.1:3200:3200" # tempo (tracing)
      - "127.0.0.1:4317:4317" # gRPC (OTeL)
      - "127.0.0.1:4318:4318" # http (OTeL)
    # volumes:
    #   - ./container/grafana:/data/grafana
    #   - ./container/prometheus:/data/prometheus
    #   - ./container/loki:/data/loki
    environment:
      - GF_PATHS_DATA=/data/grafana

  # === OPS API STACK ===
  # custody-a / custody-b: ASP.NET HSM service, one per Privacy Node so each
  # custody container's EVM_JSON_RPC points at the matching chain. The shared
  # singleton approach failed deploys with INVALID_OPERATION on eth_estimateGas
  # because TransactionService.cs builds Web3(config.EVM_JSON_RPC) per request
  # — there's no per-request RPC override, so 1 custody can only serve 1 chain.
  #
  # Each container has its own DB (raylzdb_a/raylzdb_b) so wallets and
  # transaction history stay scoped to that chain. The bootstrap step runs
  # against each ops-api → its matching custody.
  custody-a:
    build:
      context: ../rayls-privacy-custody-light
      dockerfile: Dockerfile.dev
    ports:
      - 127.0.0.1:5032:5000
    volumes:
      - ../rayls-privacy-custody-light:/app
      # Per-instance NuGet cache: custody-a and custody-b both run `dotnet restore`
      # in parallel at startup; a SHARED cache volume races on package extraction
      # (temp .xxx files vanish, "Directory not empty") and corrupts the build.
      - custody-a-nuget-cache:/root/.nuget/packages
      - custody-a-dotnet-cache:/app/src/Rayls.Custody.HSM.API/obj
    environment:
      ASPNETCORE_ENVIRONMENT: LOC
      MACHINE: DEBUG
      POSTGRESQL_SERVER: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: admin
      POSTGRESQL_DBNAME: raylzdb_a
      AUTH_API_KEY: dev
      AUTH_JWT_SECRET: dev-jwt-secret-do-not-use-in-prod
      EVM_JSON_RPC_CHAIN_ID: ${PRIVACY_NODE_A_CHAIN_ID:-12345}
      EVM_JSON_RPC: ${PRIVACY_NODE_A_RPC_URL:-http://pn-a:8545}
      USES_AWS: "false"
      KMS_MAX_WALLETS: 200
      KEYSTORE_MAX_WALLETS: 20
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        dotnet restore src/Rayls.Custody.HSM.API/Rayls.Custody.HSM.API.csproj
        while true; do
          dotnet run \
            --project src/Rayls.Custody.HSM.API/Rayls.Custody.HSM.API.csproj \
            --no-launch-profile \
            --urls "http://+:5000"
          echo "Custody app exited, restarting in 5s..."
          sleep 5
        done
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  custody-b:
    build:
      context: ../rayls-privacy-custody-light
      dockerfile: Dockerfile.dev
    ports:
      - 127.0.0.1:5033:5000
    volumes:
      - ../rayls-privacy-custody-light:/app
      # Per-instance NuGet cache (see custody-a note) — avoids the parallel-restore
      # corruption from sharing one cache volume between custody-a and custody-b.
      - custody-b-nuget-cache:/root/.nuget/packages
      - custody-b-dotnet-cache:/app/src/Rayls.Custody.HSM.API/obj
    environment:
      ASPNETCORE_ENVIRONMENT: LOC
      MACHINE: DEBUG
      POSTGRESQL_SERVER: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: admin
      POSTGRESQL_DBNAME: raylzdb_b
      AUTH_API_KEY: dev
      AUTH_JWT_SECRET: dev-jwt-secret-do-not-use-in-prod
      EVM_JSON_RPC_CHAIN_ID: ${PRIVACY_NODE_B_CHAIN_ID:-12346}
      EVM_JSON_RPC: ${PRIVACY_NODE_B_RPC_URL:-http://pn-b:8546}
      USES_AWS: "false"
      KMS_MAX_WALLETS: 200
      KEYSTORE_MAX_WALLETS: 20
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        dotnet restore src/Rayls.Custody.HSM.API/Rayls.Custody.HSM.API.csproj
        while true; do
          dotnet run \
            --project src/Rayls.Custody.HSM.API/Rayls.Custody.HSM.API.csproj \
            --no-launch-profile \
            --urls "http://+:5000"
          echo "Custody app exited, restarting in 5s..."
          sleep 5
        done
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  custody-c:
    build:
      context: ../rayls-privacy-custody-light
      dockerfile: Dockerfile.dev
    ports:
      - 127.0.0.1:5034:5000
    volumes:
      - ../rayls-privacy-custody-light:/app
      - custody-c-nuget-cache:/root/.nuget/packages
      - custody-c-dotnet-cache:/app/src/Rayls.Custody.HSM.API/obj
    environment:
