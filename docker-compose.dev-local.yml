          target: /app/.C.env
        - action: sync+restart
          path: ./cts/air.toml
          target: /app/cts/air.toml
        - action: sync
          path: ./
          target: /app
  cts-d:
    <<: *cts-base
    ports:
      - 127.0.0.1:8083:8083
      - 127.0.0.1:8093:8093
      - 127.0.0.1:4003:4003
      # Fault-injection control surface — see cts-a for context.
      - 127.0.0.1:6803:6803
    env_file:
      - path: .D.env
        required: false
