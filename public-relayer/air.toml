# Config file for [Air](https://github.com/cosmtrek/air) in TOML format

# Working directory
# . or absolute path, please note that the directories following must be under root
root = "." 
tmp_dir = "tmp"

[build]
# Just plain old shell command. You could use `make` as well.
# BUILD_TAGS is read from the environment so dev rebuilds match whatever tag
# set was used for the initial image build (see Dockerfile.public-relayer-dev).
# Empty by default — set BUILD_TAGS=faultinjection (in the compose service)
# to opt in to chaos testing.
cmd = "go build ${BUILD_TAGS:+-tags ${BUILD_TAGS}} -gcflags \"all=-N -l\" -o ./tmp/app/pubrelayer-app /app/public-relayer/cmd/main.go"
# Binary file yields from `cmd`.
bin = "tmp/app"

# Customize binary.
# This is how you start to run your application. Since my application will works like CLI, so to run it, like to make a CLI call.
full_bin = "cat $ENV_FILE && ./docker/development/start_pubrelayer.sh"
# This log file places in your tmp_dir.
log = "air_errors.log"
# Manual rebuild mode: Air watches only scripts/rebuild.sh.
# Source files are synced into the container by docker compose watch,
# but Air only recompiles when you bump the script's mtime — either
# `./scripts/rebuild.sh` or `touch scripts/rebuild.sh` works.
include_ext = [""]
include_file = ["scripts/rebuild.sh"]
exclude_dir = ["tmp"]
# It's not necessary to trigger build each time file changes if it's too frequent.
delay = 1000 # ms
# Stop running old binary when build errors occur.
stop_on_error = true
# Send Interrupt signal before killing process (windows does not support this feature)
send_interrupt = true
# Delay after sending Interrupt signal
kill_delay = 1000 # ms

[log]
# Show log time
time = true

[misc]
# Delete tmp directory on exit
clean_on_exit = true