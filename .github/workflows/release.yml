name: Release

# Publishes the three relayer images when a maintainer pushes a v* tag.
# The pipeline itself lives in raylsnetwork/rayls-sovereign-workflows.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: raylsnetwork/rayls-sovereign-workflows/.github/workflows/release-container.yml@v1
    with:
      images: >-
        [
          {"image": "relayer-private", "dockerfile": "private-relayer/Dockerfile"},
          {"image": "relayer-public",  "dockerfile": "public-relayer/Dockerfile"},
          {"image": "cts",             "dockerfile": "cts/Dockerfile"}
        ]
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
